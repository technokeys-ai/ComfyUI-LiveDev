[project]
name = "comfyui_livedev"
description = "A full-featured development toolkit and workflow power-suite for ComfyUI: live-reload custom nodes, visual Workflow Gallery, magnetic Align Snap & Guides, Visual Fold, Bypass LiveDev remote board, Wires & Connections (12 routing styles, 24 visual effects, Slot Quick-Action Pill), Dependencies Rollback Hub, Smart Error Auto-Fixer, Profiler, Pre-Flight Check, and live GPU/RAM telemetry."
version = "1.1.0"
license = { file = "LICENSE" }
authors = [{ name = "TechnoKeys" }]
requires-python = ">=3.10"
dependencies = ["watchdog>=3.0.0", "psutil>=5.8.0", "packaging>=21.0", "requests>=2.28.0"]

[project.urls]
Homepage = "https://github.com/technokeys-ai"
Repository = "https://github.com/technokeys-ai/ComfyUI-LiveDev"
Documentation = "https://github.com/technokeys-ai/ComfyUI-LiveDev#readme"
"Bug Tracker" = "https://github.com/technokeys-ai/ComfyUI-LiveDev/issues"

# Used by Comfy Registry https://comfyregistry.org
[tool.comfy]
PublisherId = "technokeys-ai"
DisplayName = "ComfyUI-LiveDev"
Icon = "https://raw.githubusercontent.com/technokeys-ai/ComfyUI-LiveDev/main/icon.svg"
requires-comfyui = ">=0.38.0"
